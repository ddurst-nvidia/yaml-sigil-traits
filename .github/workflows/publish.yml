name: Publish

# This workflow distributes one crates.io source package and creates an
# annotated version tag plus a source-only GitHub Release. It builds, uploads,
# and retains no executable artifact.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate or publish an official release.
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish

permissions: {}

env:
  # Resolve the manifest's explicit `crates-io` publish allowlist by name.
  CARGO_REGISTRIES_CRATES_IO_INDEX: https://github.com/rust-lang/crates.io-index

# Publication is resumable, so never cancel a run that may already have
# uploaded a source package while a replacement waits for approval.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validation:
    name: Validate release
    if: ${{ inputs.operation == 'validate' || inputs.operation == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate invocation
        env:
          EXPECTED_REPOSITORY: NVIDIA/yaml-sigil-traits
        run: |
          # Prevent a copied workflow from operating in another repository.
          if [[ "${GITHUB_REPOSITORY}" != "${EXPECTED_REPOSITORY}" ]]; then
            echo "This workflow runs only in ${EXPECTED_REPOSITORY}." >&2
            exit 1
          fi
          # Official release authority belongs only to exact protected main.
          if [[ "${GITHUB_REF}" != "refs/heads/main" \
            || "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "Official release operations must use exact main." >&2
            exit 1
          fi

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install and verify release analyzers
        run: bash .github/scripts/install-release-tools.sh

      - name: Configure read-only release forge identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/configure-release-git-user.sh

      - name: Require a committed release version
        run: |
          cargo xtask release-version check
          git diff --exit-code

      # `autobins = false` prevents implicit executable targets. Reject an
      # explicit `[[bin]]` target before any release-plz invocation.
      - name: Require a library-only release package
        run: bash .github/scripts/check-release-packages.sh yaml-sigil-traits

      - name: Package with Cargo
        run: cargo package

      - name: Validate release-plz publication plan
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          # Exercise package selection and forge discovery without OIDC or writes.
          release-plz release \
            --dry-run \
            --forge github \
            --config .release-plz.toml \
            --manifest-path Cargo.toml

  publication:
    name: Publish release
    if: ${{ inputs.operation == 'publish' }}
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    permissions:
      # Create the version tag and source-only Release after publication.
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install and verify release analyzers
        run: bash .github/scripts/install-release-tools.sh

      - name: Configure protected publication forge identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/configure-release-git-user.sh

      - name: Recheck the committed release version
        run: |
          cargo xtask release-version check
          git diff --exit-code

      - name: Publish with Trusted Publishing
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          # Exchange only this protected job's OIDC identity, publish source,
          # and create the configured annotated tag and source-only Release.
          release-plz release \
            --forge github \
            --config .release-plz.toml \
            --manifest-path Cargo.toml

      - name: Verify crates.io publication
        run: bash .github/scripts/verify-crates-io-packages.sh yaml-sigil-traits

      - name: Request the next release proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo xtask release-version show)"
          jq --null-input --arg version "${version}" \
            '{event_type: "official-release-published", client_payload: {version: $version}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
